seed: 424
use_wandb: false
input_data_dir: /qwarium/home/d.a.lanovenko/llm-detect-ai/datasets/final_prepared

model:
  backbone_path: mistralai/Mistral-7B-v0.1
  max_length: 512  # Increased length for Russian essays
  num_labels: 1
  
  tokenizer:
    padding_side: left
    truncation_side: left
    use_fast: false

  lora:
    target_modules:
      - q_proj
      - k_proj
      - v_proj
      - o_proj
    r: 8  # Standard LoRA rank
    lora_alpha: 16
    lora_dropout: 0.1
    modules_to_save:
      - classification_head

train_params:
  per_device_train_batch_size: 1
  per_device_eval_batch_size: 1
  num_train_epochs: 3  # 3 epochs for small dataset
  gradient_accumulation_steps: 16  # Effective batch size 16
  warmup_pct: 0.1
  eval_frequency: 122  # Evaluate every ~122 steps (1 epoch = 122 steps with batch=1, grad_accum=16, 1958 samples)
  patience: 5
  save_trigger: 0.85
  use_mask_aug: false

optimizer:
  name: AdamW
  head_lr: 1e-5
  lr: 2e-5
  weight_decay: 1e-2
  max_grad_norm: 0.5

outputs:
  model_dir: /qwarium/home/d.a.lanovenko/models/r_detect_final_dataset

wandb:
  project: detect-ai-a1
  run_name: exp_final_dataset_mistral
  tags:
    - mistral
    - final_dataset
    - russian_essays
