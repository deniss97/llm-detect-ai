# Qwen2.5-7B Detection Model Configuration (V2)
# Optimized for H100-80GB with FlashAttention-2, DoRA, QLoRA

# Model settings
model:
  name: "Qwen/Qwen2.5-7B-Instruct"
  num_labels: 2
  attn_implementation: "flash_attention_2"
  use_cache: false

# LoRA/DoRA settings
lora:
  r: 32
  alpha: 64
  dropout: 0.05
  use_dora: true
  use_rslora: true
  target_modules:
    - "q_proj"
    - "k_proj"
    - "v_proj"
    - "o_proj"
    - "gate_proj"
    - "up_proj"
    - "down_proj"

# Tokenizer settings
tokenizer:
  truncation: true
  max_length: 2048
  padding: false

# Training settings
training:
  num_train_epochs: 2
  per_device_train_batch_size: 4
  per_device_eval_batch_size: 8
  gradient_accumulation_steps: 4
  learning_rate: 1.0e-4
  lr_scheduler_type: "cosine"
  warmup_ratio: 0.1
  weight_decay: 0.01
  bf16: true
  tf32: true
  gradient_checkpointing: true
  optim: "adamw_torch_fused"
  logging_steps: 20
  eval_strategy: "steps"
  eval_steps: 100
  save_strategy: "steps"
  save_steps: 100
  save_total_limit: 2
  load_best_model_at_end: true
  metric_for_best_model: "roc_auc"
  greater_is_better: true
  report_to: "none"
  seed: 42

# Data settings
data:
  train_path: "/qwarium/home/d.a.lanovenko/llm-detect-ai/datasets/final_prepared/final_train.csv"
  valid_path: "/qwarium/home/d.a.lanovenko/llm-detect-ai/datasets/final_prepared/final_valid.csv"
  text_column: "text"
  label_column: "generated"

# Output settings
outputs:
  output_dir: "/tmp/llm_cache/models/r_detect_qwen3"
  logging_dir: "/tmp/llm_logs/train_r_detect_qwen3"

# Hydra defaults
defaults:
  - _self_
