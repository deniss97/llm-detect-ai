# Конфигурация для обучения Embedding модели (USER-bge-m3) на триплетах
# Использует контрастивное обучение с MultipleNegativesRankingLoss + Matryoshka

seed: 42
use_wandb: false

# Датасет с триплетами
train_dataset: datasets/final_prepared_embed_ranking/train_triplets.csv
valid_dataset: datasets/final_prepared_embed_ranking/valid_triplets.csv

# Колонки для триплетов
anchor_column: anchor
positive_column: positive
negative_column: negative

model:
  backbone_path: deepvk/USER-bge-m3  # Современная русскоязычная embedding модель
  max_length: 512  # Оптимально для сочинений
  dropout_rate: 0.1
  gradient_checkpointing: true
  projection_dim: 512
  temperature: 0.07  # Температура для контрастивного обучения
  
  # Matryoshka embeddings (опционально)
  use_matryoshka: false
  matryoshka_dims: [256, 128, 64]

train_params:
  per_device_train_batch_size: 4  # Batch size для триплетов
  per_device_eval_batch_size: 8
  num_train_epochs: 3
  gradient_accumulation_steps: 4  # Эффективный batch = 16
  
  learning_rate: 2e-5
  warmup_ratio: 0.1
  weight_decay: 0.01
  
  eval_frequency: 50  # Оценка каждые N шагов
  patience: 5  # Ранняя остановка
  save_best_only: true

optimizer:
  eps: 1e-8
  beta1: 0.9
  beta2: 0.999
  max_grad_norm: 1.0

outputs:
  model_dir: /tmp/llm_cache/models/r_embed_final  # Сохраняем в /tmp (2.3TB свободно)

wandb:
  project: detect-ai-final
  run_name: r-embed-final-triplets
  tags:
    - user-bge-m3
    - final-dataset
    - triplets
    - contrastive
