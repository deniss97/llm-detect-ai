model:
  name: Qwen/Qwen3-8B
  num_labels: 1
  torch_dtype: bfloat16
  attn_implementation: flash_attention_2
  use_cache: false
tokenizer:
  name: Qwen/Qwen3-8B
  max_length: 2048
  padding: false
  truncation: true
lora:
  r: 32
  alpha: 64
  dropout: 0.05
  bias: none
  target_modules:
  - q_proj
  - k_proj
  - v_proj
  - o_proj
  - gate_proj
  - up_proj
  - down_proj
  use_rslora: true
  use_dora: true
  modules_to_save:
  - score
training:
  num_train_epochs: 3
  per_device_train_batch_size: 4
  per_device_eval_batch_size: 8
  gradient_accumulation_steps: 2
  learning_rate: 0.0001
  lr_scheduler_type: cosine
  warmup_ratio: 0.1
  weight_decay: 0.01
  bf16: true
  tf32: true
  gradient_checkpointing: true
  optim: adamw_torch_fused
  logging_steps: 20
  eval_strategy: steps
  eval_steps: 100
  save_strategy: steps
  save_steps: 100
  save_total_limit: 3
  load_best_model_at_end: true
  metric_for_best_model: roc_auc
  greater_is_better: true
  report_to:
  - none
  seed: 42
data:
  train_path: /qwarium/home/d.a.lanovenko/llm-detect-ai/datasets/final_prepared/final_train.csv
  valid_path: /qwarium/home/d.a.lanovenko/llm-detect-ai/datasets/final_prepared/final_valid.csv
  text_column: text
  label_column: generated
outputs:
  output_dir: /tmp/llm_cache/models/r_detect_qwen3
  model_dir: /tmp/llm_cache/models/r_detect_qwen3
